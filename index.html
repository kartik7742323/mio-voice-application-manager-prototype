<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mio AI Voice in Application Manager · Prototype v2</title>
<style>
:root{
  --font-sans:"Inter","Roboto",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --fs-10:10px;--fs-11:11px;--fs-12:12px;--fs-13:13px;--fs-14:14px;--fs-15:15px;--fs-16:16px;--fs-18:18px;--fs-22:22px;
  --fw-400:400;--fw-500:500;--fw-600:600;--fw-700:700;--fw-800:800;
  --lh-tight:1.2;--lh-snug:1.35;--lh-normal:1.5;--lh-relaxed:1.6;
  --brand-blue:#2979d4;--brand-blue-hover:#1f6ac0;--brand-blue-600:#1E40AF;--brand-blue-700:#1E3A8A;
  --brand-blue-50:#EFF6FF;--brand-blue-100:#DBEAFE;--brand-blue-200:#BFDBFE;
  --mio-purple:#7953b5;--mio-indigo:#6675e2;--mio-purple-500:#7C3AED;--mio-purple-dark:#5B21B6;
  --mio-purple-50:#F5F3FF;--mio-purple-100:#DDD6FE;
  --mio-gradient:linear-gradient(135deg,#7953b5,#6675e2);
  --fg-1:#111827;--fg-2:#374151;--fg-3:#6B7280;--fg-4:#9CA3AF;--fg-5:#D1D5DB;
  --bg-app:#eef0f4;--bg-canvas:#F8FAFC;--bg-surface:#ffffff;--bg-subtle:#FAFAFA;--bg-subtler:#F9FAFB;--bg-row-alt:#FAFCFF;
  --border-1:#E5E7EB;--border-2:#F3F4F6;--border-3:#D8D8D8;
  --success-fg:#16A34A;--success-bg:#DCFCE7;--warning-fg:#D97706;--warning-bg:#FEF3C7;
  --danger-fg:#dc2626;--danger-bg:#FEE2E2;--info-fg:#0EA5E9;--info-bg:#E0F2FE;
  --chip-active-fg:#1a9e6e;--chip-active-bg:#DCFCE7;--chip-draft-fg:#888888;--chip-draft-bg:#F3F4F6;
  --lead-bg:#ddeeff;--lead-fg:#1a5f9e;--opp-bg:#d4f5e9;--opp-fg:#0e6649;--slate-bg:#eef0f4;--slate-fg:#475569;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;--sp-12:48px;
  --r-xs:4px;--r-sm:6px;--r-md:8px;--r-lg:10px;--r-xl:12px;--r-pill:999px;
  --sh-xs:0 1px 2px rgba(0,0,0,.05);--sh-sm:0 1px 4px rgba(0,0,0,.06);--sh-md:0 4px 14px rgba(0,0,0,.09);--sh-lg:0 16px 48px rgba(0,0,0,.2);
  --focus:0 0 0 3px rgba(41,121,212,.125);--sh-mio:0 2px 8px rgba(121,83,181,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font-sans);font-size:var(--fs-13);color:var(--fg-1);background:var(--bg-app);line-height:var(--lh-normal);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--brand-blue);outline-offset:1px;border-radius:var(--r-xs)}
.mt-eyebrow{font-size:var(--fs-10);font-weight:var(--fw-700);letter-spacing:.6px;text-transform:uppercase;color:var(--fg-3)}
.mt-meta{font-size:var(--fs-12);color:var(--fg-3)}
.mt-micro{font-size:var(--fs-11);color:var(--fg-4)}
.mono{font-family:var(--font-mono);font-size:var(--fs-12);letter-spacing:.2px}
.grow{flex:1}

/* ---------- tab strip ---------- */
.tabstrip{display:flex;align-items:stretch;background:var(--bg-surface);border-bottom:1px solid var(--border-1);padding:0 var(--sp-4);gap:var(--sp-1);overflow-x:auto;position:sticky;top:0;z-index:40}
.tabstrip button{padding:var(--sp-3) var(--sp-3);font-size:var(--fs-13);font-weight:var(--fw-500);color:var(--fg-3);border-bottom:2px solid transparent;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.tabstrip button[aria-current="page"]{color:var(--brand-blue);font-weight:var(--fw-600);border-bottom-color:var(--brand-blue)}
.tabstrip .who{font-size:var(--fs-10);color:var(--fg-4);font-weight:var(--fw-500)}
.tabstrip .tg{align-self:center;font-size:var(--fs-10);font-weight:var(--fw-700);letter-spacing:.6px;text-transform:uppercase;color:var(--fg-4);padding:0 var(--sp-1) 0 var(--sp-2);white-space:nowrap}
.tabstrip .sep{width:1px;background:var(--border-1);margin:var(--sp-3) var(--sp-2)}
.tabstrip .deferred{color:var(--fg-4)}

/* ---------- shell ---------- */
.shell{display:flex;min-height:calc(100vh - 52px)}
.rail{width:56px;flex:0 0 56px;background:#111827;display:flex;flex-direction:column;align-items:center;padding:var(--sp-3) 0;gap:var(--sp-2)}
.rail .logo{width:34px;height:34px;border-radius:var(--r-lg);background:var(--mio-gradient);color:#fff;display:grid;place-items:center;font-weight:var(--fw-800);font-size:var(--fs-16);box-shadow:var(--sh-mio);margin-bottom:var(--sp-3)}
.rail .ricon{width:34px;height:34px;border-radius:var(--r-md);display:grid;place-items:center;color:#9CA3AF}
.rail .ricon:hover{background:rgba(255,255,255,.08);color:#fff}
.rail .ricon[aria-current="true"]{background:rgba(41,121,212,.22);color:#fff}
.rail .spacer{flex:1}
.mio-launcher{width:40px;height:40px;border-radius:var(--r-pill);background:var(--mio-gradient);display:grid;place-items:center;box-shadow:var(--sh-mio);color:#fff}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--bg-surface);border-bottom:1px solid var(--border-1);padding:var(--sp-3) var(--sp-5);display:flex;align-items:center;gap:var(--sp-4)}
.hamb{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--fg-2)}
.entity{display:flex;align-items:center;gap:var(--sp-2);border:1px solid var(--border-1);background:var(--bg-surface);border-radius:var(--r-lg);padding:var(--sp-2) var(--sp-3);font-weight:var(--fw-600);color:var(--fg-1);box-shadow:var(--sh-xs)}
.rolebar{display:flex;align-items:center;gap:var(--sp-2);background:var(--bg-subtler);border:1px solid var(--border-1);border-radius:var(--r-pill);padding:3px}
.rolebar button{padding:5px var(--sp-3);border-radius:var(--r-pill);font-size:var(--fs-12);font-weight:var(--fw-600);color:var(--fg-3)}
.rolebar button[aria-pressed="true"]{background:var(--bg-surface);color:var(--brand-blue);box-shadow:var(--sh-xs)}
.askmio{background:var(--mio-gradient);color:#fff;border-radius:var(--r-pill);padding:6px 14px;font-weight:var(--fw-600);font-size:var(--fs-12);display:flex;align-items:center;gap:6px;box-shadow:var(--sh-mio)}
.avatar{width:32px;height:32px;border-radius:var(--r-pill);background:var(--brand-blue-100);color:var(--brand-blue-700);display:grid;place-items:center;font-weight:var(--fw-700)}
.content{flex:1;padding:var(--sp-5);background:var(--bg-app);min-width:0}

/* ---------- common ---------- */
.pagehead{display:flex;align-items:center;gap:var(--sp-4);margin-bottom:var(--sp-4);flex-wrap:wrap}
.pagehead h1{margin:0;font-size:var(--fs-18);font-weight:var(--fw-600);letter-spacing:-.01em}
.subtabs{display:flex;gap:var(--sp-5);border-left:1px solid var(--border-1);padding-left:var(--sp-4)}
.subtabs button{padding:var(--sp-2) 0;font-weight:var(--fw-500);color:var(--fg-2);border-bottom:2px solid transparent}
.subtabs button[aria-current="page"]{color:var(--brand-blue);border-bottom-color:var(--brand-blue);font-weight:var(--fw-600)}
.iconbtn{width:34px;height:34px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--fg-3);border:1px solid transparent}
.iconbtn:hover{background:var(--bg-surface);border-color:var(--border-1)}
.filterbar{background:var(--bg-surface);border:1px solid var(--border-1);border-radius:var(--r-lg);padding:var(--sp-3) var(--sp-4);display:flex;gap:var(--sp-3);align-items:center;margin-bottom:var(--sp-4);flex-wrap:wrap;color:var(--fg-3)}
.fsel{border:1px solid var(--border-1);border-radius:var(--r-sm);padding:3px 10px;min-width:130px;display:flex;flex-direction:column;align-items:flex-start;background:var(--bg-surface);text-align:left}
.fsel .fl{font-size:var(--fs-10);color:var(--fg-3)}
.fsel .fv{font-size:var(--fs-12);color:var(--fg-4)}
.tablecard{background:var(--bg-surface);border:1px solid var(--border-1);border-radius:var(--r-lg);overflow:auto}
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-13)}
.tbl th{background:var(--bg-subtle);color:var(--fg-2);font-weight:var(--fw-600);text-align:left;padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border-1);white-space:nowrap;vertical-align:bottom}
.tbl td{padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border-2);vertical-align:middle;color:var(--fg-1)}
.tbl tbody tr:nth-child(even) td{background:var(--bg-row-alt)}
.tbl tbody tr:hover td{background:var(--brand-blue-50)}
.tbl .th-cfg{display:block;font-size:var(--fs-10);color:var(--fg-4);font-weight:var(--fw-500);max-width:180px;overflow:hidden;text-overflow:ellipsis}
.tbl .cellclip{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.tablefoot{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-1);color:var(--fg-3)}
.linkbtn{color:var(--brand-blue);font-weight:var(--fw-500);text-align:left}
.linkbtn:hover{text-decoration:underline}
.tr-sys td{color:var(--fg-2)}
.plus{display:inline-grid;place-items:center;min-width:20px;height:18px;border-radius:var(--r-pill);background:var(--bg-subtle);border:1px solid var(--border-1);font-size:var(--fs-10);font-weight:var(--fw-700);color:var(--fg-3);margin-left:6px;padding:0 4px}
.kebab{width:28px;height:28px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--fg-3);font-size:18px;line-height:1}
.kebab:hover{background:var(--bg-subtle)}
.btn{border-radius:var(--r-md);padding:var(--sp-2) var(--sp-5);font-weight:var(--fw-600);font-size:var(--fs-13);display:inline-flex;align-items:center;gap:var(--sp-2);border:1px solid transparent;white-space:nowrap}
.btn-primary{background:var(--brand-blue);color:#fff}
.btn-primary:hover{background:var(--brand-blue-hover)}
.btn-secondary{background:var(--bg-surface);border-color:var(--border-1);color:var(--fg-2)}
.btn-secondary:hover{background:var(--bg-subtle)}
.btn-danger{background:var(--bg-surface);border-color:#fecaca;color:var(--danger-fg)}
.btn-danger:hover{background:var(--danger-bg)}
.btn-sm{padding:5px var(--sp-3);font-size:var(--fs-12)}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
select.inp,input.inp,textarea.inp{width:100%;border:1px solid var(--border-1);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);background:var(--bg-surface);color:var(--fg-1);font-size:var(--fs-13)}
select.inp:focus,input.inp:focus,textarea.inp:focus{outline:none;border-color:var(--brand-blue);box-shadow:var(--focus)}
.inp[aria-invalid="true"]{border-color:var(--danger-fg);box-shadow:0 0 0 3px rgba(220,38,38,.10)}
.inp.readonly,.inp[readonly]{background:var(--bg-subtler);color:var(--fg-3)}
select.inp:disabled{background:var(--bg-subtler);color:var(--fg-3)}
.f label{display:block;font-size:var(--fs-12);font-weight:var(--fw-600);color:var(--fg-2);margin-bottom:5px}
.f .req{color:var(--danger-fg)}
.f .hint{font-size:var(--fs-11);color:var(--fg-3);margin-top:4px}
.f .err{font-size:var(--fs-11);color:var(--danger-fg);margin-top:4px;font-weight:var(--fw-500)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4)}
.stack{display:flex;flex-direction:column;gap:var(--sp-4)}
.switch{width:40px;height:22px;border-radius:var(--r-pill);background:var(--fg-5);position:relative;transition:background .15s;flex:0 0 40px;display:inline-block}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:var(--r-pill);background:#fff;transition:left .15s;box-shadow:var(--sh-xs)}
.switch[aria-checked="true"]{background:var(--brand-blue)}
.switch[aria-checked="true"]::after{left:21px}
.switch.sm{width:34px;height:18px;flex-basis:34px}
.switch.sm::after{width:12px;height:12px}
.switch.sm[aria-checked="true"]::after{left:19px}
.switch.mio[aria-checked="true"]{background:var(--mio-purple)}
.switch[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.banner{border-radius:var(--r-lg);padding:var(--sp-3) var(--sp-4);display:flex;gap:var(--sp-3);align-items:flex-start;margin-bottom:var(--sp-4);font-size:var(--fs-13);color:var(--fg-2);line-height:var(--lh-snug)}
.banner svg{flex:0 0 auto;margin-top:1px}
.banner.info{background:var(--brand-blue-50);border:1px solid var(--brand-blue-200)}
.banner.mio{background:var(--mio-purple-50);border:1px solid var(--mio-purple-100)}
.banner.mio svg{color:var(--mio-purple)}
.banner.warn{background:var(--warning-bg);border:1px solid #fde68a}
.banner.err{background:var(--danger-bg);border:1px solid #fecaca;color:#7f1d1d}
.banner b,.banner strong{color:var(--fg-1)}
.banner.err b{color:#7f1d1d}
.lockchip{display:inline-flex;align-items:center;gap:4px;border-radius:var(--r-pill);padding:2px 8px;font-size:var(--fs-10);font-weight:var(--fw-700);letter-spacing:.3px;background:var(--slate-bg);color:var(--slate-fg);white-space:nowrap}
.msgbox{border:1px dashed var(--border-3);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);color:var(--fg-2);font-size:var(--fs-13);background:var(--bg-subtler)}
.formchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-1);background:var(--bg-surface);border-radius:var(--r-pill);padding:2px 10px;font-size:var(--fs-12);font-weight:var(--fw-600);color:var(--fg-2);max-width:100%}
.newtag{display:inline-block;background:var(--brand-blue-50);color:var(--brand-blue-700);border:1px solid var(--brand-blue-200);border-radius:var(--r-xs);padding:0 6px;font-size:var(--fs-10);font-weight:var(--fw-700);letter-spacing:.3px;vertical-align:middle;margin-left:6px}

/* ---------- master-detail (agent management) ---------- */
.panel{background:var(--bg-surface);border:1px solid var(--border-1);border-radius:var(--r-xl);box-shadow:var(--sh-sm);overflow:hidden;display:flex;min-height:680px}
.lpane{width:330px;flex:0 0 330px;border-right:1px solid var(--border-1);display:flex;flex-direction:column;background:var(--bg-surface)}
.vendorbar{padding:var(--sp-4);border-bottom:1px solid var(--border-1);background:var(--bg-subtler);display:flex;align-items:center;gap:var(--sp-3)}
.vendorbar label{font-size:var(--fs-11);font-weight:var(--fw-700);letter-spacing:.6px;text-transform:uppercase;color:var(--fg-3)}
.vendorbar select{flex:1;font-weight:var(--fw-600)}
.listwrap{flex:1;overflow-y:auto;padding:var(--sp-3);max-height:78vh}
.grouphead{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2);margin-top:var(--sp-2);color:var(--fg-3)}
.grouphead .gtitle{flex:1;font-size:var(--fs-11);font-weight:var(--fw-700);letter-spacing:.6px;text-transform:uppercase;color:var(--fg-2)}
.count{background:var(--slate-bg);color:var(--slate-fg);border-radius:var(--r-pill);padding:1px 8px;font-size:var(--fs-11);font-weight:var(--fw-600)}
.addbtn{color:var(--brand-blue);font-weight:var(--fw-600);font-size:var(--fs-12);border:1px solid var(--brand-blue-200);background:var(--brand-blue-50);border-radius:var(--r-sm);padding:3px 9px}
.addbtn:hover{background:var(--brand-blue-100)}
.searchbox{position:relative;margin:var(--sp-2)}
.searchbox input{padding-left:30px}
.searchbox svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--fg-4)}
.agent{width:100%;text-align:left;display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);border-radius:var(--r-md);color:var(--fg-2);font-size:var(--fs-13);border:1px solid transparent}
.agent:hover{background:var(--bg-subtle)}
.agent[aria-current="true"]{background:var(--brand-blue-50);border-color:var(--brand-blue-200);color:var(--brand-blue-700);font-weight:var(--fw-600)}
.dot{width:8px;height:8px;border-radius:var(--r-pill);background:var(--brand-blue);flex:0 0 8px}
.agent .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proggroup{margin-left:var(--sp-2)}
.progtitle{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2);font-weight:var(--fw-600);color:var(--fg-1);font-size:var(--fs-13);width:100%;text-align:left}
.caret{color:var(--fg-4);transition:transform .15s;display:inline-flex}
.progtitle[aria-expanded="false"] .caret{transform:rotate(-90deg)}
.rpane{flex:1;min-width:0;overflow-y:auto;padding:var(--sp-6) var(--sp-8);background:var(--bg-surface);max-height:84vh}
.detail-head{display:flex;align-items:flex-start;gap:var(--sp-4);margin-bottom:var(--sp-6)}
.detail-head h1{margin:0 0 var(--sp-3);font-size:var(--fs-22);font-weight:var(--fw-700);letter-spacing:-.01em;color:var(--fg-1);word-break:break-word}
.editing-title .pre{font-size:var(--fs-15);font-weight:var(--fw-500);color:var(--fg-3)}
.badges{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center}
.badge{border-radius:var(--r-pill);padding:3px 10px;font-size:var(--fs-11);font-weight:var(--fw-700);letter-spacing:.4px;text-transform:uppercase}
.badge.app{background:var(--slate-bg);color:var(--slate-fg)}
.badge.goal{background:var(--brand-blue-50);color:var(--brand-blue-700);text-transform:none;letter-spacing:0;font-weight:var(--fw-600);display:inline-flex;align-items:center;gap:6px}
.badge.goal .dot{width:6px;height:6px;flex:0 0 6px}
.badge.vendor{background:var(--chip-draft-bg);color:var(--chip-draft-fg)}
.badge.mode-edit{background:var(--warning-bg);color:var(--warning-fg)}
.badge.mode-new{background:var(--success-bg);color:var(--success-fg)}
.headactions{margin-left:auto;display:flex;gap:var(--sp-3)}
.card{border:1px solid var(--border-1);border-radius:var(--r-xl);background:var(--bg-surface);margin-bottom:var(--sp-5);overflow:hidden}
.card-head{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-4) var(--sp-5);color:var(--fg-3)}
.card-head .ct{font-size:var(--fs-11);font-weight:var(--fw-700);letter-spacing:.6px;text-transform:uppercase;color:var(--fg-2)}
.card-head .right{margin-left:auto}
.card-body{padding:0 var(--sp-5) var(--sp-5)}
.row{display:grid;grid-template-columns:200px 1fr auto;gap:var(--sp-4);align-items:center;padding:var(--sp-3) 0;border-top:1px solid var(--border-2)}
.row:first-child{border-top:none}
.row .k{color:var(--fg-3);font-size:var(--fs-13)}
.row .v{color:var(--fg-1);font-size:var(--fs-14);min-width:0;word-break:break-word}
.copybtn{border:1px solid var(--border-1);border-radius:var(--r-sm);padding:3px 10px;font-size:var(--fs-12);color:var(--fg-2);background:var(--bg-surface);white-space:nowrap}
.copybtn:hover{background:var(--bg-subtle)}
.fieldchips{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.fieldchip{background:var(--brand-blue-50);color:var(--brand-blue-700);border-radius:var(--r-pill);padding:4px 12px;font-size:var(--fs-12);font-weight:var(--fw-500);display:inline-flex;align-items:center;gap:6px}
.fieldchip button{color:var(--brand-blue-700);font-size:var(--fs-13);line-height:1}
.fieldchip button:hover{color:var(--danger-fg)}
.ctxgroup{margin-bottom:var(--sp-3)}
.ctxgroup .cg{font-size:var(--fs-11);font-weight:var(--fw-700);color:var(--fg-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.note-body{color:var(--fg-2);font-size:var(--fs-14);line-height:var(--lh-relaxed)}
.formsec{margin-bottom:var(--sp-5);border:1px solid var(--border-1);border-radius:var(--r-xl);padding:var(--sp-5)}
.formsec > .st{font-size:var(--fs-11);font-weight:var(--fw-700);letter-spacing:.6px;text-transform:uppercase;color:var(--fg-3);margin-bottom:var(--sp-3);display:flex;align-items:center;gap:var(--sp-2)}
.pane-formerr{border:1px solid #fecaca;background:var(--danger-bg);color:#991b1b;border-radius:var(--r-lg);padding:var(--sp-4) var(--sp-5);margin-bottom:var(--sp-5);font-size:var(--fs-13)}
.pane-formerr ul{margin:8px 0 0;padding-left:18px}
.pane-formerr li{margin-bottom:3px}
.chipselect{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;border:1px solid var(--border-1);border-radius:var(--r-md);padding:var(--sp-2);min-height:42px}
.chipselect select{border:none;background:transparent;flex:1;min-width:190px;padding:4px;color:var(--fg-3)}
.chipselect select:focus{outline:none}
.kvt{width:100%;border-collapse:collapse}
.kvt th,.kvt td{text-align:left;padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--border-2);font-size:var(--fs-13);vertical-align:top}
.kvt th{background:var(--bg-subtle);font-weight:var(--fw-600);color:var(--fg-2)}
.kvt td:first-child{color:var(--fg-2);width:42%}

/* ---------- states ---------- */
.empty{display:grid;place-items:center;text-align:center;padding:var(--sp-12) var(--sp-6);color:var(--fg-3)}
.empty .ei{width:56px;height:56px;border-radius:var(--r-pill);background:var(--brand-blue-50);color:var(--brand-blue);display:grid;place-items:center;margin:0 auto var(--sp-4)}
.empty h2{margin:0 0 var(--sp-2);font-size:var(--fs-16);color:var(--fg-1);font-weight:var(--fw-600)}
.empty p{margin:0 auto var(--sp-5);max-width:460px;font-size:var(--fs-13)}
.skel{background:linear-gradient(90deg,#eef0f4 25%,#f6f7f9 37%,#eef0f4 63%);background-size:400% 100%;animation:sh 1.3s ease-in-out infinite;border-radius:var(--r-sm)}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
.errbox{border:1px solid #fecaca;background:var(--danger-bg);border-radius:var(--r-lg);padding:var(--sp-5);display:flex;gap:var(--sp-3);align-items:flex-start;max-width:640px;color:#dc2626}
.errbox h3{margin:0 0 var(--sp-2);font-size:var(--fs-14);color:#991b1b;font-weight:var(--fw-600)}
.errbox p{margin:0 0 var(--sp-3);color:#7f1d1d;font-size:var(--fs-13)}

/* ---------- overlay, drawer, modal, menu ---------- */
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;z-index:60}
.overlay.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100vw);background:var(--bg-surface);box-shadow:var(--sh-lg);z-index:61;transform:translateX(105%);transition:transform .2s ease;display:flex;flex-direction:column;visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.drawer-head{padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border-1);display:flex;align-items:center;gap:var(--sp-3)}
.drawer-head h2{margin:0;font-size:var(--fs-18);font-weight:var(--fw-600)}
.drawer-head .sub{font-size:var(--fs-14);color:var(--fg-3);font-weight:var(--fw-400)}
.stepchip{border:1px solid var(--border-1);border-radius:var(--r-pill);padding:2px 10px;font-size:var(--fs-11);font-weight:var(--fw-600);color:var(--fg-2);white-space:nowrap}
.drawer-body{flex:1;overflow-y:auto;padding:var(--sp-5)}
.drawer-foot{padding:var(--sp-3) var(--sp-5);border-top:1px solid var(--border-1);display:flex;gap:var(--sp-3);align-items:center}
.modal{position:fixed;z-index:65;top:50%;left:50%;transform:translate(-50%,-50%);width:min(720px,calc(100vw - 48px));max-height:calc(100vh - 64px);background:var(--bg-surface);border-radius:var(--r-xl);box-shadow:var(--sh-lg);display:none;flex-direction:column}
.modal.open{display:flex}
.modal.wide{width:min(900px,calc(100vw - 48px))}
.modal-head{padding:var(--sp-4) var(--sp-6);border-bottom:1px solid var(--border-1);display:flex;align-items:center;gap:var(--sp-3)}
.modal-head h2{margin:0;font-size:var(--fs-16);font-weight:var(--fw-600)}
.modal-close{margin-left:auto;width:30px;height:30px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--fg-3);flex:0 0 30px}
.modal-close:hover{background:var(--bg-subtle)}
.modal-body{padding:var(--sp-5) var(--sp-6);overflow-y:auto;font-size:var(--fs-13);color:var(--fg-2)}
.modal-body p{margin:0 0 var(--sp-3)}
.modal-foot{padding:var(--sp-3) var(--sp-6);border-top:1px solid var(--border-1);display:flex;gap:var(--sp-3);justify-content:flex-end;background:var(--bg-subtler);border-radius:0 0 var(--r-xl) var(--r-xl)}
.overlay.modal-on{z-index:64}
.menu{position:fixed;z-index:80;background:var(--bg-surface);border:1px solid var(--border-1);border-radius:var(--r-md);box-shadow:var(--sh-md);padding:var(--sp-1);min-width:220px;display:none}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:var(--sp-2) var(--sp-3);border-radius:var(--r-sm);font-size:var(--fs-13);color:var(--fg-1)}
.menu button:hover{background:var(--bg-subtle)}
.menu button[aria-disabled="true"]{color:var(--fg-4);cursor:not-allowed}
.menu .mhint{font-size:var(--fs-11);color:var(--fg-4);padding:0 var(--sp-3) var(--sp-2);max-width:260px}
.splitbtn{display:inline-flex}
.splitbtn .btn{border-radius:0}
.splitbtn .btn:first-child{border-radius:var(--r-md) 0 0 var(--r-md)}
.splitbtn .btn.caretbtn{border-radius:0 var(--r-md) var(--r-md) 0;padding:0 10px;border-left:1px solid rgba(255,255,255,.35)}
.splitbtn .btn.caretbtn[aria-expanded="true"]{background:var(--brand-blue-hover)}
.menu.typemenu{width:292px;padding:6px 0;border-radius:var(--r-lg);box-shadow:0 10px 30px rgba(17,24,39,.14)}
.menu .tm-head{font-size:var(--fs-11);font-weight:var(--fw-700);letter-spacing:.6px;text-transform:uppercase;color:var(--fg-4);padding:10px 14px 6px}
.menu button.tm-opt{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border-radius:0}
.menu button.tm-opt:hover{background:var(--bg-subtler)}
.tm-ic{width:32px;height:32px;border-radius:var(--r-md);display:grid;place-items:center;flex:0 0 32px}
.tm-ic.mio{background:var(--mio-gradient);color:#fff;box-shadow:var(--sh-mio)}
.tm-ic.reg{background:var(--brand-blue-50);border:1px solid var(--brand-blue-100);color:var(--brand-blue)}
.tm-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.tm-t{font-size:var(--fs-13);font-weight:var(--fw-600);color:var(--fg-1)}
.tm-d{font-size:var(--fs-12);line-height:1.45;color:var(--fg-3)}
.menu .tm-sep{height:1px;background:var(--border-2);margin:4px 14px}

/* ---------- DA config: step 1 ---------- */
.setcard{display:flex;align-items:center;gap:var(--sp-3);border:1px solid var(--border-1);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-3);background:var(--bg-surface);flex-wrap:wrap}
.setcard .ico{width:32px;height:32px;display:grid;place-items:center;color:var(--fg-3);flex:0 0 32px}
.setcard .txt{flex:1;min-width:160px}
.setcard .t{font-weight:var(--fw-500);color:var(--fg-1);font-size:var(--fs-14)}
.setcard .d{font-size:var(--fs-12);color:var(--fg-3)}
.setcard.locked{background:var(--bg-subtler)}
.setcard.locked .t{color:var(--fg-2)}
.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin-bottom:var(--sp-3)}
.setgrid .setcard{margin-bottom:0}
.miocard{border:1px solid var(--mio-purple-100);background:var(--mio-purple-50);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-3)}
.miocard .mi{width:32px;height:32px;border-radius:var(--r-pill);background:var(--mio-gradient);color:#fff;display:grid;place-items:center;flex:0 0 32px;box-shadow:var(--sh-mio)}
.fakesel{border:1px solid var(--border-1);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);width:100%;text-align:left;display:flex;align-items:center;gap:var(--sp-2);background:var(--bg-surface);min-height:38px;color:var(--fg-1)}
.fakesel .ph{color:var(--fg-4)}
.fakesel .caret2{margin-left:auto;color:var(--fg-4);display:inline-flex}
.fakesel.readonly{background:var(--bg-subtler);color:var(--fg-2)}
.maxc{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:var(--fs-11);color:var(--brand-blue)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--border-1);border-radius:var(--r-sm);margin-left:44px}
.stepper span{min-width:56px;text-align:center}
.stepper button{width:30px;height:30px;color:var(--brand-blue);font-size:16px}
/* mapping */
.mapwrap{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4)}
.mapcol{border:1px solid var(--border-1);border-radius:var(--r-md);min-height:320px;display:flex;flex-direction:column;overflow:hidden}
.mapcol .mh{padding:var(--sp-3) var(--sp-4);font-weight:var(--fw-600);color:var(--fg-2);border-bottom:1px solid var(--border-2);background:var(--bg-subtler)}
.modopt{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border-2);width:100%;text-align:left}
.modopt[aria-selected="true"]{background:var(--brand-blue-50);font-weight:var(--fw-600)}
.modopt[aria-disabled="true"]{color:var(--fg-4);cursor:not-allowed}
.modopt .ok{margin-left:auto;width:18px;height:18px;border-radius:var(--r-pill);background:var(--success-fg);color:#fff;display:grid;place-items:center;font-size:11px}
.modopt .why{margin-left:auto;font-size:var(--fs-11);color:var(--fg-4);font-weight:var(--fw-400)}
.chk{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-4);border-bottom:1px solid var(--border-2);cursor:pointer}
.chk input{width:15px;height:15px;accent-color:var(--brand-blue);flex:0 0 15px}
.chk .who2{margin-left:auto;font-size:var(--fs-11);color:var(--fg-4);white-space:nowrap}
/* layout builder */
.lbtop{background:var(--bg-surface);border:1px solid var(--border-1);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:var(--sp-3) var(--sp-4);display:flex;align-items:center;gap:var(--sp-3)}
.lbtop h1{margin:0;font-size:var(--fs-16);font-weight:var(--fw-600)}
.lbstrip{background:var(--brand-blue);color:#fff;text-align:center;padding:var(--sp-3);font-weight:var(--fw-700);letter-spacing:.4px}
.lbwrap{display:flex;border:1px solid var(--border-1);border-top:none;border-radius:0 0 var(--r-lg) var(--r-lg);overflow:hidden;min-height:620px;background:var(--bg-app)}
.lbel{width:290px;flex:0 0 290px;background:#1f2a44;color:#e5e7eb;display:flex;flex-direction:column}
.lbel .lh{padding:var(--sp-4);font-weight:var(--fw-700);font-size:var(--fs-15);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
.lbel .ltabs{display:flex;gap:var(--sp-5);padding:0 var(--sp-4);border-bottom:1px solid rgba(255,255,255,.08)}
.lbel .ltabs button{padding:var(--sp-3) 0;color:#9ca3af;font-weight:var(--fw-600);border-bottom:2px solid transparent}
.lbel .ltabs button[aria-current="page"]{color:#fff;border-bottom-color:#93c5fd}
.lbel .lsearch{padding:var(--sp-3) var(--sp-4)}
.lbel .lsearch input{background:#2b3756;border:1px solid #3b4768;color:#fff}
.lbel .lflist{overflow-y:auto;flex:1;max-height:520px}
.lbel .lf{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-bottom:1px solid rgba(255,255,255,.06);width:100%;text-align:left;color:#e5e7eb}
.lbel .lf:hover{background:rgba(255,255,255,.06)}
.lbel .lf .ty{margin-left:auto;font-size:var(--fs-10);color:#9ca3af;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.lbel .lf[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.lbel .lnote{padding:var(--sp-3) var(--sp-4);font-size:var(--fs-11);color:#9ca3af}
.lbcanvas{flex:1;overflow-y:auto;padding:var(--sp-6);max-height:720px}
.lbsec{background:var(--bg-surface);border:1px solid var(--border-1);border-radius:var(--r-lg);box-shadow:var(--sh-sm);max-width:760px;margin:0 auto var(--sp-5)}
.lbsec .sh{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4) var(--sp-5);width:100%;text-align:left;color:var(--fg-2)}
.lbsec .sh .st{font-size:var(--fs-16);font-weight:var(--fw-500);color:var(--fg-1)}
.lbsec .sh .sd{font-size:var(--fs-12);color:var(--fg-3)}
.lbsec.open .sh{background:var(--brand-blue-50);border-radius:var(--r-lg) var(--r-lg) 0 0}
.lbsec.open .sh .st{color:var(--brand-blue)}
.lbsec .sb{padding:var(--sp-4) var(--sp-6) var(--sp-5)}
.lbfield{margin-bottom:var(--sp-3)}
.lbfield label{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-13);color:var(--fg-2);margin-bottom:5px;flex-wrap:wrap}
.lbfield .key{margin-left:auto;font-family:var(--font-mono);font-size:var(--fs-11);color:var(--fg-4)}
.cfrow{display:flex;align-items:center;gap:var(--sp-3);border:1px solid var(--border-1);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-3);background:var(--bg-surface)}
.cfrow .nm{font-weight:var(--fw-500);word-break:break-word}
.cfrow .ty{font-size:var(--fs-11);color:var(--fg-3)}
.cfrow .rm{margin-left:auto;color:var(--fg-3);width:28px;height:28px;border-radius:var(--r-sm);display:grid;place-items:center;flex:0 0 28px}
.cfrow .rm:hover{background:var(--danger-bg);color:var(--danger-fg)}
.dropzone{border:2px dashed var(--border-3);border-radius:var(--r-lg);padding:var(--sp-8);text-align:center;color:var(--fg-3);font-size:var(--fs-15)}
.lbel .lf[draggable="true"]{cursor:grab}
.lbel .lf[draggable="true"]:active{cursor:grabbing}
body.dragging .lbsec[data-drop]{box-shadow:0 0 0 2px var(--brand-blue-200)}
body.dragging .lbsec[data-drop] .dropzone{border-color:var(--brand-blue);color:var(--brand-blue);background:var(--brand-blue-50)}
.lbsec.drop-over{box-shadow:0 0 0 3px var(--brand-blue)}
.lbsec.drop-over .dropzone{border-style:solid;background:var(--brand-blue-100)}
.meter{display:flex;align-items:center;gap:var(--sp-3);font-size:var(--fs-12);color:var(--fg-3);max-width:760px;margin:0 auto var(--sp-4);flex-wrap:wrap}
.meter .bar{flex:1;min-width:120px;height:6px;border-radius:var(--r-pill);background:var(--border-1);overflow:hidden}
.meter .bar span{display:block;height:100%;background:var(--brand-blue)}

/* ---------- timeline ---------- */
.seg{display:flex;border:1px solid var(--border-1);border-radius:var(--r-md);overflow:hidden;background:var(--bg-surface)}
.seg button{padding:6px 14px;font-weight:var(--fw-600);color:var(--fg-3);border-right:1px solid var(--border-1)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--brand-blue-50);color:var(--brand-blue-700)}
.seg.miof button[aria-pressed="true"]{background:var(--mio-purple-50);color:var(--mio-purple-dark)}
.profile{background:var(--bg-surface);border:1px solid var(--border-1);border-radius:var(--r-lg);padding:var(--sp-4) var(--sp-5);display:flex;gap:var(--sp-4);align-items:center;margin-bottom:var(--sp-4);flex-wrap:wrap}
.profile .pn{font-size:var(--fs-16);font-weight:var(--fw-600)}
.av{width:44px;height:44px;border-radius:var(--r-pill);background:var(--brand-blue-100);color:var(--brand-blue-700);display:grid;place-items:center;font-weight:var(--fw-700);flex:0 0 44px}
.av.sm{width:30px;height:30px;flex-basis:30px;font-size:var(--fs-11)}
.pmeta{display:flex;gap:var(--sp-4);flex-wrap:wrap;font-size:var(--fs-12);color:var(--fg-3)}
.pmeta b{color:var(--fg-1);font-weight:var(--fw-600)}
.tl{background:var(--bg-surface);border:1px solid var(--border-1);border-radius:var(--r-lg);padding:var(--sp-2) var(--sp-5)}
.tli{display:grid;grid-template-columns:96px 34px 1fr;gap:var(--sp-3);padding:var(--sp-4) 0;border-bottom:1px solid var(--border-2)}
.tli:last-child{border-bottom:none}
.tli .when{font-size:var(--fs-12);color:var(--fg-1);font-weight:var(--fw-600)}
.tli .when span{display:block;font-weight:var(--fw-400);color:var(--fg-3);font-size:var(--fs-11)}
.tli .ic{width:30px;height:30px;border-radius:var(--r-pill);background:var(--mio-purple-50);color:var(--mio-purple);display:grid;place-items:center}
.tli .ic.plain{background:var(--bg-subtle);color:var(--fg-3)}
.tli .body{font-size:var(--fs-13);color:var(--fg-2);line-height:var(--lh-relaxed);min-width:0}
.tli .dacard{margin-top:var(--sp-3);border:1px solid var(--border-1);border-radius:var(--r-md);overflow:hidden;background:var(--bg-surface)}
.player{display:flex;align-items:center;gap:var(--sp-3);border:1px solid var(--border-1);border-radius:var(--r-pill);padding:4px var(--sp-3);background:var(--bg-subtler);max-width:360px}
.player button{width:26px;height:26px;border-radius:var(--r-pill);background:var(--brand-blue);color:#fff;display:grid;place-items:center;flex:0 0 26px}
.player .pb{flex:1;height:4px;border-radius:var(--r-pill);background:var(--border-1);position:relative;overflow:hidden}
.player .pb span{position:absolute;left:0;top:0;bottom:0;background:var(--brand-blue);border-radius:var(--r-pill)}
.player .tm{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--fg-3)}
.transcript{max-height:220px;overflow-y:auto;border:1px solid var(--border-1);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);background:var(--bg-subtler);font-size:var(--fs-13);line-height:var(--lh-relaxed);white-space:pre-line}

/* ---------- listing ---------- */
.lsbar{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-3);flex-wrap:wrap}
.selbar{background:var(--brand-blue-50);border:1px solid var(--brand-blue-200);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-4);display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-3);font-weight:var(--fw-600);color:var(--brand-blue-700);flex-wrap:wrap}
.afpanel{background:var(--bg-surface);border:1px solid var(--border-1);border-radius:var(--r-lg);padding:var(--sp-4) var(--sp-5);margin-bottom:var(--sp-4);box-shadow:var(--sh-sm)}
.cond{display:grid;grid-template-columns:160px minmax(180px,1.1fr) minmax(180px,1.1fr) 150px minmax(140px,1fr) 32px;gap:var(--sp-3);align-items:end;margin-bottom:var(--sp-3)}
.cond .rmc{width:32px;height:36px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--fg-3)}
.cond .rmc:hover{background:var(--danger-bg);color:var(--danger-fg)}
.appchip{display:inline-flex;gap:6px;align-items:center;background:var(--bg-subtler);border:1px solid var(--border-1);border-radius:var(--r-pill);padding:3px 10px;font-size:var(--fs-12);margin:0 6px 6px 0}
.stchip{display:inline-block;border-radius:var(--r-pill);padding:2px 10px;font-size:var(--fs-11);font-weight:var(--fw-600);white-space:nowrap}
.st-conn{background:var(--success-bg);color:var(--success-fg)}
.st-na{background:var(--danger-bg);color:var(--danger-fg)}
.st-busy{background:var(--warning-bg);color:var(--warning-fg)}
.st-none{background:var(--chip-draft-bg);color:var(--chip-draft-fg)}
.st-q{background:var(--brand-blue-50);color:var(--brand-blue-700)}
.faint{color:var(--fg-4);font-size:var(--fs-12)}
.dots{display:flex;gap:4px;align-items:center}
.dots i{width:10px;height:10px;border-radius:var(--r-pill);display:block}
.dots i.c{background:var(--success-fg)}
.dots i.n{background:var(--danger-fg)}
.dots i.p{background:var(--warning-fg)}
.dots i.e{background:var(--border-1)}
.ccstep{display:flex;gap:var(--sp-2);align-items:center;margin-bottom:var(--sp-4);font-size:var(--fs-12);color:var(--fg-3)}

.cfgopt{display:flex;align-items:center;gap:var(--sp-3);border:1px solid var(--border-1);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-2);cursor:pointer}

/* ---------- campaign panel ---------- */
.sumbar{display:flex;align-items:center;gap:var(--sp-3);background:var(--brand-blue-50);border:1px solid var(--brand-blue-200);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-4);flex-wrap:wrap}

.stepblk{border:1px solid var(--border-1);border-radius:var(--r-lg);padding:var(--sp-4);margin-bottom:var(--sp-4)}

.retrycards{display:grid;grid-template-columns:1.3fr 1fr;gap:var(--sp-3)}

.rcard .rt{display:flex;align-items:center;gap:var(--sp-2);font-weight:var(--fw-600)}

.rrow{display:flex;align-items:center;gap:var(--sp-2);border:1px solid var(--border-1);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);margin-top:var(--sp-2);background:var(--bg-surface);flex-wrap:wrap}

.rrow select{width:110px}

/* ---------- report ---------- */
.srcchips{display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center}
.srcchip{border:1px solid var(--border-1);border-radius:var(--r-pill);padding:4px 12px;font-size:var(--fs-12);font-weight:var(--fw-600);color:var(--fg-3);background:var(--bg-surface)}
.srcchip[aria-pressed="true"]{background:var(--brand-blue-50);border-color:var(--brand-blue-200);color:var(--brand-blue-700)}

.jobhead{background:var(--bg-surface);border:1px solid var(--border-1);border-radius:var(--r-lg);padding:var(--sp-4) var(--sp-5);margin-bottom:var(--sp-4);display:flex;gap:var(--sp-4);align-items:flex-start;flex-wrap:wrap}

.jobmeta{display:flex;flex-wrap:wrap;gap:var(--sp-4);align-items:center;font-size:var(--fs-12);color:var(--fg-3);margin-top:var(--sp-2)}

.ibtn{width:18px;height:18px;border-radius:var(--r-pill);border:1px solid var(--border-3);font-size:var(--fs-10);font-weight:var(--fw-700);color:var(--fg-3);display:inline-grid;place-items:center;font-style:italic}
.ipop{position:relative;display:inline-flex;align-items:center;gap:6px}
.ipop .pop{position:absolute;top:24px;left:0;z-index:20;background:var(--bg-surface);border:1px solid var(--border-1);border-radius:var(--r-md);box-shadow:var(--sh-md);padding:var(--sp-3);min-width:230px;color:var(--fg-2);font-size:var(--fs-12)}
.kpis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:var(--sp-3);margin-bottom:var(--sp-4)}
.kpi{background:var(--bg-surface);border:1px solid var(--border-1);border-radius:var(--r-lg);padding:var(--sp-3) var(--sp-4)}
.kpi .v{font-size:var(--fs-18);font-weight:var(--fw-700);color:var(--fg-1)}
.kpi .l{font-size:var(--fs-11);color:var(--fg-3)}

/* ---------- insights ---------- */
.inshead{display:flex;align-items:center;gap:var(--sp-4);margin-bottom:var(--sp-4);flex-wrap:wrap}

.tile{background:var(--bg-surface);border:1px solid var(--border-1);border-radius:var(--r-lg);padding:var(--sp-4) var(--sp-5);box-shadow:var(--sh-xs);min-height:122px;position:relative}
.tile .tl2{display:flex;align-items:center;gap:6px}
.tile .tv{font-size:var(--fs-22);font-weight:var(--fw-700);margin:var(--sp-2) 0 2px;color:var(--fg-1)}
.tile .ts{font-size:var(--fs-12);color:var(--fg-3)}
.tile .tip{position:relative;display:inline-flex}
.tile .tip .tt{display:none;position:absolute;left:-8px;top:22px;z-index:20;width:250px;background:var(--fg-1);color:#fff;border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);font-size:var(--fs-11);line-height:var(--lh-snug);text-transform:none;letter-spacing:0;font-weight:var(--fw-500)}
.tile .tip:hover .tt,.tile .tip:focus-within .tt{display:block}
.delta{display:inline-block;margin-top:var(--sp-2);border-radius:var(--r-xs);padding:1px 6px;font-size:var(--fs-11);font-weight:var(--fw-700)}
.delta.up{background:var(--success-bg);color:var(--success-fg)}
.delta.down{background:var(--danger-bg);color:var(--danger-fg)}
.delta.flat{background:var(--chip-draft-bg);color:var(--chip-draft-fg)}
.tile.soon{background:linear-gradient(180deg,var(--bg-surface),var(--mio-purple-50));display:flex;flex-direction:column}
.soonchip{margin:auto;border-radius:var(--r-pill);background:var(--bg-surface);color:var(--mio-purple);padding:4px 12px;font-size:var(--fs-12);font-weight:var(--fw-600);box-shadow:var(--sh-xs)}
.box{background:var(--bg-surface);border:1px solid var(--border-1);border-radius:var(--r-lg);margin-bottom:var(--sp-5);overflow:hidden}
.box .bh{padding:var(--sp-4) var(--sp-5);font-weight:var(--fw-600);color:var(--fg-1);border-bottom:1px solid var(--border-2)}
.box .bh span{display:block;font-weight:var(--fw-400);font-size:var(--fs-12);color:var(--fg-3)}
.pct{display:inline-block;background:var(--brand-blue-50);color:var(--brand-blue-700);border-radius:var(--r-pill);padding:1px 8px;font-size:var(--fs-11);font-weight:var(--fw-700);margin-left:6px}
.twocol{display:grid;grid-template-columns:2fr 1fr;gap:var(--sp-5)}

.hmgrid .dl{font-size:var(--fs-11);color:var(--fg-3);text-align:center}

.legend{display:flex;gap:var(--sp-4);flex-wrap:wrap;justify-content:center;padding:0 var(--sp-5) var(--sp-4);font-size:var(--fs-12);color:var(--fg-2)}

/* ---------- notes drawer ---------- */
.notes-toggle{position:fixed;right:var(--sp-5);bottom:var(--sp-5);z-index:50;background:var(--fg-1);color:#fff;border-radius:var(--r-pill);padding:var(--sp-3) var(--sp-5);font-weight:var(--fw-600);font-size:var(--fs-12);box-shadow:var(--sh-md);display:flex;align-items:center;gap:var(--sp-2)}
.notes{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);background:var(--bg-surface);border-left:1px solid var(--border-1);box-shadow:var(--sh-lg);z-index:70;transform:translateX(105%);transition:transform .2s ease;display:flex;flex-direction:column;visibility:hidden}
.notes.open{transform:none;visibility:visible}
.notes-head{padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border-1);display:flex;align-items:center;gap:var(--sp-3)}
.notes-head h2{margin:0;font-size:var(--fs-15);font-weight:var(--fw-700)}
.vbadge{background:var(--fg-1);color:#fff;border-radius:var(--r-pill);padding:2px 9px;font-size:var(--fs-10);font-weight:var(--fw-700);letter-spacing:.4px;white-space:nowrap}
.notes-body{overflow-y:auto;padding:var(--sp-5);font-size:var(--fs-12);color:var(--fg-2);line-height:var(--lh-relaxed)}
.notes-body h3{font-size:var(--fs-11);text-transform:uppercase;letter-spacing:.6px;color:var(--fg-3);margin:var(--sp-6) 0 var(--sp-3);font-weight:var(--fw-700)}
.notes-body h3:first-child{margin-top:0}
.notes-body table{width:100%;border-collapse:collapse;font-size:var(--fs-11)}
.notes-body th,.notes-body td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border-2);vertical-align:top}
.notes-body th{background:var(--bg-subtle);color:var(--fg-2);font-weight:var(--fw-600)}
.notes-body ol,.notes-body ul{padding-left:18px;margin:0}
.notes-body li{margin-bottom:6px}
.tag{display:inline-block;border-radius:var(--r-xs);padding:1px 6px;font-size:var(--fs-10);font-weight:var(--fw-700);white-space:nowrap}
.tag.cov{background:var(--success-bg);color:var(--success-fg)}
.tag.par{background:var(--warning-bg);color:var(--warning-fg)}
.tag.def{background:var(--chip-draft-bg);color:var(--chip-draft-fg)}
.statebtns,.jumps{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.statebtns button,.jumps button{border:1px solid var(--border-1);border-radius:var(--r-sm);padding:5px 11px;font-size:var(--fs-12);font-weight:var(--fw-500);color:var(--fg-2);background:var(--bg-surface)}
.statebtns button[aria-pressed="true"]{background:var(--brand-blue);border-color:var(--brand-blue);color:#fff;font-weight:var(--fw-600)}
.jumps button:hover{background:var(--brand-blue-50);border-color:var(--brand-blue-200)}
.acctrow{display:flex;align-items:center;gap:var(--sp-3);margin-top:var(--sp-3);border:1px solid var(--border-1);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3)}

/* inert control marking */
[data-inert]{position:relative}
[data-inert]::after{content:"";position:absolute;right:2px;top:2px;width:5px;height:5px;border-radius:var(--r-pill);background:var(--fg-5)}
.inert-toast{position:fixed;left:50%;bottom:var(--sp-6);transform:translateX(-50%);background:var(--fg-1);color:#fff;border-radius:var(--r-md);padding:var(--sp-3) var(--sp-5);font-size:var(--fs-12);box-shadow:var(--sh-md);z-index:90;opacity:0;pointer-events:none;transition:opacity .18s;max-width:min(640px,calc(100vw - 32px));text-align:center}
.inert-toast.show{opacity:1}
.toast-ok{background:#064e3b}
@media (max-width:1280px){
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tiles.six{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cond{grid-template-columns:150px 1fr 1fr 130px 1fr 32px}
}
@media (max-width:1100px){

  .rpane{padding:var(--sp-5)}
  .row{grid-template-columns:150px 1fr auto}
  .lbel{width:230px;flex:0 0 230px}
  .twocol{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cond{grid-template-columns:1fr 1fr}
}

function tsOf(v){ const m=String(v).match(/(\d+) (\w{3}) (\d{4}),? (\d+):(\d+) (AM|PM)/); return m?new Date(+m[3],MON[m[2]],+m[1],(+m[4]%12)+(m[6]==="PM"?12:0),+m[5]).getTime():0; }
function dlRows(){
  if(S.mode==="empty") return [];
  const rows=DL_OTHER.map(r=>({type:"system",cfg:r.cfg,mod:r.mod,on:r.on,sub:r.sub,owner:MIO_NOTE.owner,at:r.at}));
  const push=(a,cid,r)=>{ const c=cfg(cid); if(!c||!r) return;
    if(c.mio||c.sys) rows.push({type:"system",cfg:cid,mod:"Application Manager",on:a.name,sub:a.no,owner:MIO_NOTE.owner,at:r.df_mio_call_start_date});
    else if(r._at) rows.push({type:"default",cfg:cid,mod:"Application Manager",on:a.name,sub:a.no,owner:r._by,at:r._at}); };

}

function agValidate(){
  const f=S.ag.f, e={}, sv=f.vendor==="sarvam", alnum=/^[A-Za-z0-9_\-]+$/;
  if(!f.form) e.form="Application Form is required.";
  if(!f.name.trim()) e.name="Agent Name is required.";
  if(sv){
    if(!f.appId.trim()) e.appId="App ID is required.";
    else if(!alnum.test(f.appId.trim())) e.appId="App ID: alphanumeric characters only.";
    else { const clash=D.agents.find(a=>a.vendor==="sarvam"&&a.appId===f.appId.trim()&&a.id!==f.id&&a.form!==f.form); if(clash) e.appId="This App ID is already used on the "+esc(formName(clash.form))+" form. An agent ID can only be used on one form."; }
    const av=String(f.appVersion).trim(); if(av==="") e.appVersion="App Version is required."; else if(!/^\d+$/.test(av)||+av<1) e.appVersion="App Version must be a positive whole number.";
    [["orgId","Org ID"],["workspaceId","Workspace ID"],["connectionId","Connection ID"]].forEach(p=>{ const v=f[p[0]].trim(); if(!v) e[p[0]]=p[1]+" is required."; else if(!alnum.test(v)) e[p[0]]=p[1]+": alphanumeric characters only."; });
    if(!f.dids.length) e.dids="At least one caller ID is required.";
    if(isInternal()){ const ap=String(f.aps).trim(); if(ap==="") e.aps="Attempts Per Second is required."; else if(!/^\d+$/.test(ap)||+ap<1) e.aps="Attempts Per Second must be a positive number."; }
    if((f.callType==="Inbound"||f.callType==="Both")&&!f.deploymentId.trim()) e.deploymentId="Deployment ID is required when Call Type is Inbound or Both.";
  } else {
    if(!f.agentId.trim()) e.agentId="Agent ID is required.";
    else { const clash=D.agents.find(a=>a.vendor!=="sarvam"&&a.agentId===f.agentId.trim()&&a.id!==f.id&&a.form!==f.form); if(clash) e.agentId="This agent ID is already used on the "+esc(formName(clash.form))+" form. An agent ID can only be used on one form."; }
    if(!f.bearer.trim()) e.bearer="Bearer Token is required.";
    if(!/^\+91\d{10}$/.test((f.did||"").replace(/[\s-]/g,""))) e.did="Indian numbers only: +91 followed by 10 digits.";
  }
  if(!f.config) e.config="Select Mio Voice Config Form is required.";
  if(!f.goal) e.goal="Agent Goal is required.";
  /* goal mapping is optional, but the field and the value are set together */
  if(f.mapField&&!f.mapValue) e.mapValue="Pick a Goal Mapping Value too, or set the Goal Mapping Field back to Not set.";
  if(!f.mapField&&f.mapValue) e.mapField="Pick a Goal Mapping Field too, or set the Goal Mapping Value back to Not set.";
  if(f.mapValue==="Other"&&!(f.mapOther||"").trim()) e.mapOther="Enter the custom value, or pick another Goal Mapping Value.";
  if(f.ctxReset&&!(f.ctx.lead.length+f.ctx.form.length+f.ctx.cfg.length)) e.ctx="Context Mapping has to be filled again after the config changed. Pick at least one field.";
  if(f.winStart>=f.winEnd) e.winEnd="End time must be later than the start time.";
  return e;
}

function condText(c){ const n={eq:"=",neq:"≠",gt:">",lt:"<",on:"on",empty:"is empty",notempty:"is not empty",norec:"has no record"}; const lab=c.mod==="da"?fieldLabel(c.field)+" ("+cfgTitle(c.cfg)+")":(c.field==="stage"?"Application Stage":"City"); return lab+" "+(n[c.op]||"")+(["eq","neq","gt","lt","on"].includes(c.op)?" "+c.val:""); }
function matchCond(a,c){
  if(c.mod==="am"){ if(c.field!=="stage") return true; if(c.op==="eq") return a.stage===c.val; if(c.op==="neq") return a.stage!==c.val; if(c.op==="empty") return !a.stage; if(c.op==="notempty") return !!a.stage; return true; }
  if(c.mod==="lm") return true;
  const r=a.rec[c.cfg];
  if(c.op==="norec") return !r;
  if(!r) return false;
  const v=r[c.field], empty=(v==null||v==="");
  switch(c.op){
    case "empty": return empty;
    case "notempty": return !empty;
    case "eq": return !empty&&String(v).toLowerCase()===String(c.val).toLowerCase();
    case "neq": return !empty&&String(v).toLowerCase()!==String(c.val).toLowerCase();
    case "gt": return !empty&&+v>+c.val;
    case "lt": return !empty&&+v<+c.val;
    case "on": return !empty&&String(v).indexOf(c.val)>-1;
  }
  return true;
}

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if($("#menu").classList.contains("open")){ closeMenu(); return; }
    if($("#modal").classList.contains("open")){ closeModal(); return; }
    if(S.drawer){ closeDrawer(); return; }
    if($("#notes").classList.contains("open")){ ACT.notesClose(); return; }
    if(S.cr.pop){ S.cr.pop=false; render(); return; }
  }
  if(e.key==="Tab"){
    const L=topLayer(); if(!L) return;
    const f=[].slice.call(L.querySelectorAll('button,select,input,textarea,[tabindex]:not([tabindex="-1"])')).filter(x=>!x.disabled&&x.offsetParent!==null);
    if(!f.length) return; const first=f[0], last=f[f.length-1];
    if(!L.contains(document.activeElement)){ e.preventDefault(); first.focus(); }
    else if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});

/* ---------------- init ---------------- */
(function init(){
  const h=readHash();
  if(h.role==="internal"||h.role==="admin") S.role=h.role;
  if(["populated","empty","loading","error","edge"].includes(h.state)) S.mode=h.state;
  if(TABS.some(t=>t.id===h.tab)) S.tab=h.tab;
  loadData(); S.ag.sel=D.agents[0]?D.agents[0].id:null;
  renderChrome(); renderNotes(); render();
  if(h.jump) jump(h.jump);
})();
</script>
